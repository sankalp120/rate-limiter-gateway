version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatewaydb
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-a:
    build: ./backends/backend-a
    environment:
      PORT: 9001
      FAILURE_RATE: "0"
      LATENCY_MS: "0"
    ports:
      - "9001:9001"

  backend-b:
    build: ./backends/backend-b
    environment:
      PORT: 9002
      FAILURE_RATE: "0"
      LATENCY_MS: "0"
    ports:
      - "9002:9002"

  gateway:
    build: ./gateway
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gatewaydb
      DB_USER: gateway
      DB_PASSWORD: gateway
      BACKEND_A_URI: http://backend-a:9001
      BACKEND_B_URI: http://backend-b:9002
      JWT_SECRET: local-dev-secret-change-in-prod-min-32-bytes-long
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
